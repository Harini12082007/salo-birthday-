<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Bujji Kutty 💗</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: "Trebuchet MS", sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #ffb6d9, #ffcce6, #ffe6f2);
            position: relative;
        }

        .card {
            width: 90%;
            max-width: 550px;
            padding: 40px 25px;
            background: rgba(255, 255, 255, 0.82);
            border: 3px solid white;
            border-radius: 30px;
            box-shadow: 0 10px 35px rgba(205, 70, 130, 0.25);
            position: relative;
            z-index: 2;
        }

        .cake {
            font-size: 75px;
            margin-bottom: 15px;
            animation: bounce 2s infinite;
        }

        h1 {
            color: #e84393;
            font-size: clamp(28px, 7vw, 43px);
            margin-bottom: 15px;
        }

        .subtitle {
            color: #a83269;
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .button {
            display: inline-block;
            padding: 14px 25px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(45deg, #ff4f9a, #ff85bd);
            color: white;
            font-size: 17px;
            font-weight: bold;
            text-decoration: none;
            box-shadow: 0 5px 15px rgba(232, 67, 147, 0.3);
            transition: 0.3s;
        }

        .button:hover {
            transform: scale(1.07);
        }

        .decoration {
            position: absolute;
            font-size: 35px;
            animation: float 4s ease-in-out infinite;
            z-index: 1;
        }

        .one { top: 8%; left: 8%; }
        .two { top: 12%; right: 10%; animation-delay: 1s; }
        .three { bottom: 12%; left: 8%; animation-delay: 2s; }
        .four { bottom: 10%; right: 8%; animation-delay: 1.5s; }

        .heart {
            position: absolute;
            bottom: -30px;
            animation: rise 7s linear infinite;
            opacity: 0.8;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-18px) rotate(5deg); }
        }

        @keyframes rise {
            from {
                transform: translateY(0);
                opacity: 0.8;
            }
            to {
                transform: translateY(-110vh);
                opacity: 0;
            }
        }

        @media (max-width: 480px) {
            .card { padding: 35px 18px; }
            .decoration { font-size: 27px; }
        }
    </style>
</head>

<body>

    <div class="decoration one">🎈</div>
    <div class="decoration two">🧸</div>
    <div class="decoration three">🎁</div>
    <div class="decoration four">💗</div>

    <main class="card">
        <div class="cake">🎂</div>

        <h1>Happy Birthday<br>Bujji Kutty! 💗</h1>

        <p class="subtitle">
            Today is all about you! 🥹💕<br>
            I made a little surprise filled with<br>
            memories, smiles and lots of love. 🎀
        </p>

        <a class="button" href="pages/memories.html">
            Open Your Surprise 🎁
        </a>
    </main>

    <script>
        const emojis = ["💗", "💕", "💖", "✨", "🌸"];

        function createHeart() {
            const heart = document.createElement("div");
            heart.className = "heart";
            heart.textContent = emojis[
                Math.floor(Math.random() * emojis.length)
            ];

            heart.style.left = Math.random() * 100 + "vw";
            heart.style.fontSize = (15 + Math.random() * 20) + "px";
            heart.style.animationDuration = (5 + Math.random() * 5) + "s";

            document.body.appendChild(heart);

            setTimeout(() => heart.remove(), 10000);
        }

        setInterval(createHeart, 500);
    </script>
    
    <audio id="bgMusic" loop>
    <source src="music/bgmusic.mp3" type="audio/mpeg">
</audio><button onclick="document.getElementById('bgMusic').play()"
style="position:fixed; bottom:20px; right:20px;
padding:12px 18px; border:none; border-radius:25px;
background:#ff69b4; color:white; font-size:16px;
z-index:9999; cursor:pointer;">
🎵 Play Music 💗
</button>

</body>
</html>
